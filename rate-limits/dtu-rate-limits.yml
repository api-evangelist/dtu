description: >-
  Technical University of Denmark publishes no rate-limit table for any of its surfaces. DTU
  operates no public REST API, so there is no published quota to record. Its open
  machine-readable surfaces are static or near-static documents — SAML federation metadata,
  an OpenID Connect discovery document, an OpenSearch descriptor — and the Global Wind Atlas
  OGC WPS, which declares fees "None" and access constraints "none" but publishes no limit.
  Probed 2026-08-30: no OAI-PMH endpoint on a DTU-operated host responded, so no harvesting
  limits apply.
notes: >-
  No published global or per-service limit. Clients should call politely and honor Retry-After.
  Rate limits on data.dtu.dk are Figshare's, not DTU's, and are not recorded here.
