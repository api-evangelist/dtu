  detail: >-
    Probed on 2026-08-30. DTU publishes no OpenAPI-described public REST API and no developer
    portal; api.dtu.dk and developer.dtu.dk do not resolve. Two institution-operated
    machine-readable surfaces were found, verified and recorded: DTU's own SAML 2.0 / WS-Federation
    / OpenID Connect token service at sts.ait.dtu.dk (signed metadata 200, OIDC discovery 200,
    registered in WAYF and eduGAIN) and the Global Wind Atlas OGC WPS 1.0.0, whose GetCapabilities
    names DTU Wind Energy with a dtu.dk contact. DTU Findit publishes an OpenSearch descriptor on
    DTU's host. The five Figshare OpenAPI contracts previously attributed to DTU, and the twenty-two
    artifacts derived from them, were removed — api.figshare.com is a generic vendor host claimed by
    four other institutions in this cohort. DTU Data and DTU Orbit are re-recorded as tenant
    relationships. No OAI-PMH endpoint on a DTU host responded, and no open data portal exists.
