description: >-
  The Technical University of Denmark (DTU) is a technical university in Kongens Lyngby, Denmark.
  DTU operates no central developer portal and publishes no OpenAPI-described public REST API of its
  own. Its two clearly institution-operated machine-readable surfaces are its identity federation —
  a DTU-run SAML 2.0 / WS-Federation / OpenID Connect token service at sts.ait.dtu.dk, registered in
  the Danish national federation WAYF and in eduGAIN — and the Global Wind Atlas OGC Web Processing
  Service, whose GetCapabilities document names DTU Wind Energy as the service provider with a dtu.dk
  contact. Everything that previously read as a DTU API was not: DTU Data (data.dtu.dk) is a Figshare
  tenant and DTU Orbit (orbit.dtu.dk) is an Elsevier Pure deployment, and both are recorded here as
  tenant relationships rather than DTU contracts. DTU Learn is a D2L Brightspace tenant. The course
  catalogue at kurser.dtu.dk is DTU-operated but sign-in gated. DTU maintains public GitHub
  organizations (dtudk, DTUWindEnergy) hosting affiliated open-source software.
