reviews:
  - date: '2026-08-30'
    rating: 2
    summary: >-
      Re-profiled under the university pipeline, which settles WHO OPERATES a surface before
      any contract is saved. The five Figshare OpenAPI contracts previously held here were
      removed along with the 17 artifacts derived from them: api.figshare.com is a generic
      vendor host claimed by four other institutions in this cohort, so the contract is
      Figshare's engineering and belongs in Figshare's own repo, not DTU's. DTU Data and DTU
      Orbit are retained as tenant relationships — DTU's data on a vendor's platform — because
      the relationship is a real institutional fact even when the contract is not DTU's. Two
      genuinely institution-operated machine-readable surfaces were found that the June 2026
      profile missed entirely: DTU's own SAML 2.0 / WS-Federation / OpenID Connect token
      service at sts.ait.dtu.dk, registered in WAYF and eduGAIN, and the Global Wind Atlas OGC
      WPS whose GetCapabilities names DTU Wind Energy with a dtu.dk contact. DTU still
      publishes no OpenAPI-described public REST API and no developer portal; api.dtu.dk and
      developer.dtu.dk do not resolve. Expect this correction to LOWER the score, because the
      earlier score was Figshare's.
    endpoints:
      - url: https://sts.ait.dtu.dk/FederationMetadata/2007-06/FederationMetadata.xml
        status: 200
        note: Signed SAML 2.0 metadata for DTU's own IdP (application/samlmetadata+xml, 71,790 bytes).
