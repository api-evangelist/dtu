- aid: dtu:global-wind-atlas-wps
  name: Global Wind Atlas Web Processing Service
  x-operator: institution
  description: >-
    An OGC Web Processing Service 1.0.0 serving Global Wind Atlas results. The GetCapabilities
    document names DTU Wind Energy as the ows:ServiceProvider, with a Risø Campus, Roskilde
    address and a dtu.dk service contact, so the service is DTU-operated even though it is
    published on the project domain globalwindatlas.info rather than under dtu.dk. Fees are
    declared "None" and access constraints "none". Eight processes are offered, including
    get_libfile (a WAsP generalized wind climate for the nearest pixel), get_rose,
    get_spatial_stats, get_area_mean, get_temporal_stats, get_timeseries and get_aep. The Global
    Wind Atlas is a partnership between DTU's Department of Wind and Energy Systems and the World
    Bank Group.
  humanURL: https://globalwindatlas.info/
