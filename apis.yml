- aid: dtu:dtu-data
  name: DTU Data research data repository (Figshare tenant)
  x-operator: tenant
  description: >-
    DTU Data is DTU's institutional research data repository — DTU's records, DTU's DOIs,
    Figshare's platform and Figshare's contract. DTU records are scoped by Figshare institution
    id 379. The API that serves it is api.figshare.com/v2, a generic host every Figshare customer
    shares, so no OpenAPI is stored under DTU for it; the contract belongs in Figshare's own repo.
    Recording the relationship, not the contract, is deliberate. The tenant host itself sits behind
    an AWS WAF challenge for non-browser clients.
  humanURL: https://data.dtu.dk/
